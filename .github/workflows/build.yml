name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this version, e.g. 0.1.0 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Set version
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          if [[ -n "$RELEASE" ]]; then
            echo "VERSION_NAME=$RELEASE" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      # Optional: sign with a stable release key stored in repository secrets.
      # Without it the APK is signed with the runner's throwaway debug key.
      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "FILMLAB_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        working-directory: android
        env:
          FILMLAB_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FILMLAB_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FILMLAB_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - run: cp android/app/build/outputs/apk/release/app-release.apk FilmLab.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FilmLab-android
          path: FilmLab.apk

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate

      - name: Build
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          VERSION=0.1.0
          if [[ -n "$RELEASE" ]]; then VERSION="$RELEASE"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          xcodebuild build \
            -project FilmLab.xcodeproj \
            -scheme FilmLab \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # Unsigned: install with AltStore or Sideloadly, which sign it with your own Apple ID.
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/FilmLab.app Payload/
          zip -qry FilmLab-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: FilmLab-ios
          path: FilmLab-unsigned.ipa

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if [[ -n "$RELEASE" ]]; then TAG="v${RELEASE#v}"; fi
          cat > notes.md <<'NOTES'
          **Android:** download `FilmLab.apk` on your phone, open it, and allow installing from your browser when asked. Needs Android 10 or later.

          **iPhone:** `FilmLab-unsigned.ipa` must be signed before it installs. Use [AltStore](https://altstore.io) or [Sideloadly](https://sideloadly.io) with your Apple ID. With a free Apple ID the app has to be refreshed every 7 days. Needs iOS 17 or later.
          NOTES
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "FilmLab $TAG" \
              --notes-file notes.md
          fi
