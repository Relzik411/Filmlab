# Generate FilmLab.xcodeproj with XcodeGen: `brew install xcodegen && xcodegen`
name: FilmLab
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  FilmLab:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: FilmLab
        excludes:
          - "LUTs/**"
      - path: FilmLab/LUTs
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.filmlab
        PRODUCT_NAME: FilmLab
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FilmLab
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: FilmLab saves your edited photos to your library.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
